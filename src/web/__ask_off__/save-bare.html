@media (max-width:600px){.tile{--icon:56px}.column{padding-left:16px;padding-right:16px}.card{padding:24px 20px}h1{font-size:26px}.tile{flex-basis:100%;min-height:72px}img.tile{width:100%;contain:none;max-height:200px}.result>.tile{border-radius:18px 18px 0 0}.handy-row{grid-template-columns:1fr;gap:8px}.handy-tile{grid-template-columns:44px minmax(0,1fr) 44px;column-gap:12px;padding:10px 4px 10px 12px}.handy-image{width:44px;height:44px;border-radius:10px;--icon:32px;--initials:17px}.home-spaces{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.home-space{display:flex;align-items:center;min-height:56px;padding:0 14px}.home-space-recent{display:none}.edit-link{inset:96px 0 0;width:100%;max-width:100%;max-height:none;height:auto;margin:0;padding:0 16px 24px;border-radius:22px 22px 0 0}.edit-grabber{display:block;width:40px;height:5px;margin:8px auto 4px;border-radius:3px;background:var(--line)}.edit-head{display:grid;grid-template-columns:1fr auto 1fr;margin:0 0 8px}.edit-head h2{font-size:17px;text-align:center}.edit-top{display:inline-flex;align-items:center;justify-self:start;min-height:44px;padding:0;border:0;background:none}.edit-top-save{justify-self:end;font-weight:700}.edit-close,.edit-hint,.edit-foot{display:none}.edit-hint-phone{display:block;margin:0;font-size:13px;color:var(--soft);text-align:center}.edit-title{height:48px}.edit-picture-row{flex-direction:column;align-items:stretch}.edit-preview{width:100%;height:196px}.edit-choose{min-height:48px;width:100%}.link-row{gap:12px;padding:12px 52px 12px 12px}.row-pic{flex-basis:40px;width:40px;height:40px}.row-why{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}.link-row .card-menu{right:4px}}

<body>
<header class="column site"><a class="brand" href="/"><svg role="img" aria-label="Aye-AI-AI Links" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 36"><rect x="3.5" y="5.5" width="33" height="25" rx="12.5" fill="#fff" stroke="#2F8F83" stroke-width="5"/><rect x="27.5" y="5.5" width="33" height="25" rx="12.5" fill="#fff" stroke="#2F8F83" stroke-width="5"/><circle cx="19" cy="15.5" r="5" fill="#26262B"/><circle cx="47" cy="15.5" r="5" fill="#26262B"/></svg><span>Aye-AI-AI Links</span></a></header>
<div class="column">
<main class="save">
<h1 id="save-heading">Save a link</h1>
<form class="save-form" id="save-form">
<label for="save-url">Address</label>
<input id="save-url" name="url" type="url" required autocomplete="off" value="">
<p class="small" id="save-host" hidden></p>
<p id="url-error" role="alert"></p>
<label for="save-title">Title</label>
<input id="save-title" name="title" autocomplete="off" value="">
<p id="title-error" role="alert"></p>
<label for="save-why">Why are you saving it? (optional)</label>
<textarea id="save-why" name="why" rows="3"></textarea>
<p id="save-error" role="alert"></p>
<button class="primary" type="submit">Save</button>
</form>
<section class="save-result" id="result" hidden>
<div id="saved-link" data-id="" hidden>
<p class="save-link-title"><a target="_blank" rel="noopener noreferrer" data-open></a></p>
<p class="small" id="saved-why" hidden></p>
</div>
<p id="why-kept" hidden></p>
<div class="actions">
<button type="button" id="bring-back" hidden>Bring it back</button>
<button class="primary" type="button" id="close">Close</button>
</div>
<p id="close-note" hidden>You can close this tab.</p>
<p id="result-error" role="alert"></p>
</section>
</main>
<script>
const post = (url, body, extra) =>
  fetch(url, {
    method: "POST",
    headers: { "content-type": "application/json" },
    body: JSON.stringify(body),
    redirect: "manual",
    ...extra,
  }).catch(() => null);
const failure = async (res) => {
  const data = res && [400, 404, 409].includes(res.status) ? await res.json().catch(() => null) : null;
  return data && typeof data.message === "string"
    ? data.message
    : "That did not work. Reload the page and try again.";
};
{
const form = document.getElementById("save-form");
const urlField = document.getElementById("save-url");
const hostLine = document.getElementById("save-host");
const titleField = document.getElementById("save-title");
const whyField = document.getElementById("save-why");
const urlError = document.getElementById("url-error");
const titleError = document.getElementById("title-error");
const saveError = document.getElementById("save-error");
const heading = document.getElementById("save-heading");
const result = document.getElementById("result");
const savedLink = document.getElementById("saved-link");
const anchor = savedLink.querySelector("a");
const savedWhy = document.getElementById("saved-why");
const whyKept = document.getElementById("why-kept");
const bringBack = document.getElementById("bring-back");
const closeButton = document.getElementById("close");
const closeNote = document.getElementById("close-note");
const resultError = document.getElementById("result-error");

urlField.addEventListener("input", () => {
  const parsed = URL.parse(urlField.value.trim());
  const name = parsed ? parsed.hostname : "";
  hostLine.textContent = name ? "Saving a page from " + name : "";
  hostLine.hidden = name === "";
});

const show = (data) => {
  heading.textContent = data.created ? "Saved" : "Already saved on " + data.savedOn;
  if (!data.created) {
    savedLink.dataset.id = data.id;
    anchor.setAttribute("href", data.url);
    anchor.textContent = data.title || data.url;
    savedLink.hidden = false;
    if (data.whyKept) {
      savedWhy.textContent = data.why ? "Why: " + data.why : "";
      savedWhy.hidden = !data.why;
    } else {
      whyKept.textContent = "It already had a reason, so yours wasn't saved: “" + data.why + "”";
      whyKept.hidden = false;
    }
    bringBack.hidden = data.state !== "archived";
  }
  form.hidden = true;
  result.hidden = false;
  history.replaceState(null, "", "/save");
};

form.addEventListener("submit", async (event) => {
  event.preventDefault();
  const submit = form.querySelector("button[type=submit]");
  if (submit.disabled) return;
  urlError.textContent = "";
  titleError.textContent = "";
  saveError.textContent = "";
  submit.disabled = true;
  const res = await post("/save", {
    url: urlField.value,
    title: titleField.value,
    why: whyField.value,
  });
  const data = res && res.status === 200 ? await res.json().catch(() => null) : null;
  submit.disabled = false;
  if (data && typeof data.id === "string" && typeof data.created === "boolean") {
    show(data);
    return;
  }
  if (res && (res.type === "opaqueredirect" || res.status === 0)) {
    saveError.textContent = "You were signed out. Reload this page to sign in and come back.";
    return;
  }
  const refused = res && res.status === 400 ? await res.json().catch(() => null) : null;
  const where =
    refused && refused.code === "invalid_url"
      ? urlError
      : refused && refused.code === "invalid_input"
        ? titleError
        : saveError;
  where.textContent =
    refused && typeof refused.message === "string" ? refused.message : await failure(res);
});

bringBack.addEventListener("click", async () => {
  if (bringBack.disabled) return;
  resultError.textContent = "";
  bringBack.disabled = true;
  const res = await post("/home/unarchive", { id: savedLink.dataset.id });
  bringBack.disabled = false;
  if (res && res.status === 204) {
    heading.textContent = "Back in your list";
    bringBack.hidden = true;
  } else {
    resultError.textContent = await failure(res);
  }
});

closeButton.addEventListener("click", () => {
  window.close();
  if (window.closed) return;
  closeButton.hidden = true;
  closeNote.hidden = false;
});
}
</script>
<script>
{
const openRoot = document.getElementById("result");
const recordOpen = (event) => {
  const link = event.target.closest("a[data-open]");
  if (!link || (event.type === "auxclick" && event.button !== 1)) return;
  fetch("/links/opened", {
    method: "POST",
    headers: { "content-type": "application/json" },
    body: JSON.stringify({ id: link.closest("[data-id]").dataset.id }),
    redirect: "manual",
    keepalive: true,
  }).catch(() => {});
};
if (openRoot) {
  openRoot.addEventListener("click", recordOpen);
  openRoot.addEventListener("auxclick", recordOpen);
}
}
</script>
</div>
