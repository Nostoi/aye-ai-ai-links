name: check

on: pull_request

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        env:
          ONNXRUNTIME_NODE_INSTALL: skip
      - name: No CUDA build of onnxruntime
        run: |
          bin=node_modules/onnxruntime-node/bin/napi-v6/linux/x64
          test -e "$bin/onnxruntime_binding.node"
          test ! -e "$bin/libonnxruntime_providers_cuda.so"
      - name: Zip validators with ZIP64
        run: unzip -v | grep -q ZIP64_SUPPORT && python3 --version
      - run: npm run check
